name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  outputs:
    runs-on: ubuntu-latest
    concurrency:
      group: librepcb-ci-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: Tubbles/librepcb-ci@v1
        with:
          pages: true
          checks-fatal: false

  tray:
    runs-on: ubuntu-latest
    needs: outputs
    steps:
      - uses: actions/checkout@v4
      - name: Set the short commit hash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: echo "SHORT_SHA=${HEAD_SHA::7}" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: librepcb-ci-outputs
          path: librepcb-ci-output
      - name: Build headless FreeCAD image
        run: docker build -t freecad-headless -f scripts/freecad.Dockerfile scripts
      - name: Export tray STL
        run: |
          shopt -s globstar nullglob
          step_files=(librepcb-ci-output/**/*.step)
          if [ ${#step_files[@]} -eq 0 ]; then
            echo "::error::no .step file among the generated outputs"
            exit 1
          fi
          mkdir -p tray
          for step_file in "${step_files[@]}"; do
            base="tray/$(basename "${step_file%.step}")"
            docker run --rm -v "$PWD":/work -w /work freecad-headless \
              freecadcmd scripts/export_tray.py --pass "$step_file" "${base}_Tray_Left.stl"
            docker run --rm -v "$PWD":/work -w /work freecad-headless \
              freecadcmd scripts/export_tray.py --pass "$step_file" "${base}_Tray_Right.stl" right
          done
      - name: Upload tray STL
        uses: actions/upload-artifact@v4
        with:
          name: tray-stl
          path: tray/
          if-no-files-found: error
      - name: Export plate STL
        run: |
          shopt -s globstar nullglob
          mkdir -p plate
          for step_file in librepcb-ci-output/**/*.step; do
            base="plate/$(basename "${step_file%.step}")"
            docker run --rm -v "$PWD":/work -w /work freecad-headless \
              freecadcmd scripts/export_plate.py --pass "$step_file" \
              resources/kbdkid3-plate-left.FCStd "${base}_Plate_Left.stl"
            docker run --rm -v "$PWD":/work -w /work freecad-headless \
              freecadcmd scripts/export_plate.py --pass "$step_file" \
              resources/kbdkid3-plate-left.FCStd "${base}_Plate_Right.stl" right
            docker run --rm -v "$PWD":/work -w /work freecad-headless \
              freecadcmd scripts/export_plate.py --pass "$step_file" \
              resources/kbdkid3-plate-left.FCStd "${base}_Plate_Left_Covered.stl" covered
            docker run --rm -v "$PWD":/work -w /work freecad-headless \
              freecadcmd scripts/export_plate.py --pass "$step_file" \
              resources/kbdkid3-plate-left.FCStd "${base}_Plate_Right_Covered.stl" right covered
          done
      - name: Upload plate STL
        uses: actions/upload-artifact@v4
        with:
          name: plate-stl
          path: plate/
          if-no-files-found: error
      - name: Export PCB replica STL
        run: |
          shopt -s globstar nullglob
          mkdir -p pcb
          for step_file in librepcb-ci-output/**/*.step; do
            base="pcb/$(basename "${step_file%.step}")"
            docker run --rm -v "$PWD":/work -w /work freecad-headless \
              freecadcmd scripts/export_pcb.py --pass "$step_file" "${base}_Pcb_Left.stl"
            docker run --rm -v "$PWD":/work -w /work freecad-headless \
              freecadcmd scripts/export_pcb.py --pass "$step_file" "${base}_Pcb_Right.stl" right
          done
      - name: Upload PCB replica STL
        uses: actions/upload-artifact@v4
        with:
          name: pcb-stl
          path: pcb/
          if-no-files-found: error
      - name: Export case STL
        run: |
          shopt -s globstar nullglob
          mkdir -p case
          for step_file in librepcb-ci-output/**/*.step; do
            base="case/$(basename "${step_file%.step}")"
            docker run --rm -v "$PWD":/work -w /work freecad-headless \
              freecadcmd scripts/export_case.py --pass "$step_file" "${base}_Case_Left.stl"
            docker run --rm -v "$PWD":/work -w /work freecad-headless \
              freecadcmd scripts/export_case.py --pass "$step_file" "${base}_Case_Right.stl" right
          done
      - name: Upload case STL
        uses: actions/upload-artifact@v4
        with:
          name: case-stl
          path: case/
          if-no-files-found: error
      - name: Export solder spool axle STL
        run: |
          mkdir -p spool
          docker run --rm -v "$PWD":/work -w /work freecad-headless \
            freecadcmd scripts/export_spool_axle.py --pass spool/Solder_Spool_Axle.stl
      - name: Upload solder spool axle STL
        uses: actions/upload-artifact@v4
        with:
          name: spool-stl
          path: spool/
          if-no-files-found: error
      - name: Export camera arm STL
        run: |
          mkdir -p camera
          docker run --rm -v "$PWD":/work -w /work freecad-headless \
            freecadcmd scripts/export_camera_arm.py --pass camera
      - name: Upload camera arm STL
        uses: actions/upload-artifact@v4
        with:
          name: kbdkid4-camera-stl-${{ env.SHORT_SHA }}
          path: camera/
          if-no-files-found: error
